# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  # Black and flake8 run from the local .venv (via `language: system`) instead of
  # pre-commit's own isolated hook environments, so the version actually used is
  # whatever pip-tools locked in requirements-dev.txt - one source of truth, not two.
  - repo: local
    hooks:
      - id: black
        name: black
        entry: black
        language: system
        types: [python]

      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]

  # Built-in pre-commit hooks for basic checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=10000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']
